[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "antigenic-audit"
version = "0.1.0"
description = "Role-aware leakage and temporal evaluation audits for pairwise influenza antigenicity models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "William T. Barker" },
]
keywords = [
  "bioinformatics",
  "influenza",
  "machine-learning",
  "antigenicity",
  "data-leakage",
  "temporal-validation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.scripts]
antigenic-audit = "antigenic_audit.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/williamtbarker/antigenic-audit"
Issues = "https://github.com/williamtbarker/antigenic-audit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/antigenic_audit"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["antigenic_audit"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["×", "–", "ρ"]
